const map=L.map('map').setView([37.2,137.8],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(map);
const markers=[],list=document.getElementById('university-list'),search=document.getElementById('search');
function radarChart(u) {
  const labels = [
    "猛暑日・真夏日",
    "日較差",
    "年間降水量",
    "洪水",
    "地震リスク"
  ];

  const values = [
    u.heat,
    u.temperature,
    u.rain,
    u.flood,
    u.quake
  ];

  const cx = 150;
  const cy = 130;
  const radius = 80;
  const maxValue = 20;

  function point(value, index, scale = 1) {
    const angle = (-90 + index * 72) * Math.PI / 180;
    const r = radius * scale * Math.max(
      0, Math.min(maxValue, Number(value) || 0)
    ) / maxValue;

    return [
      cx + r * Math.cos(angle),
      cy + r * Math.sin(angle)
    ];
  }

  function polygon(scale) {
    return values.map((v, i) => {
      const p = point(v, i, scale);
      return `${p[0]},${p[1]}`;
    }).join(" ");
  }

  const grid = [0.25, 0.5, 0.75, 1].map(scale =>
    `<polygon points="${labels.map((_, i) => {
      const p = point(maxValue, i, scale);
      return `${p[0]},${p[1]}`;
    }).join(" ")}"
      fill="none" stroke="#cbd5e1" stroke-width="1"/>`
  ).join("");

  const axes = labels.map((_, i) => {
    const p = point(maxValue, i);
    return `<line x1="${cx}" y1="${cy}"
      x2="${p[0]}" y2="${p[1]}"
      stroke="#cbd5e1"/>`;
  }).join("");

  const textLabels = labels.map((label, i) => {
    const p = point(maxValue, i, 1.28);
    return `<text x="${p[0]}" y="${p[1]}"
      text-anchor="middle" dominant-baseline="middle"
      font-size="10" fill="#334155">${label}</text>`;
  }).join("");

  const dots = values.map((v, i) => {
    const p = point(v, i);
    return `<circle cx="${p[0]}" cy="${p[1]}" r="3"
      fill="#2563eb"/>`;
  }).join("");

  return `
    <div style="text-align:center;margin-top:12px">
      <b>気候・災害評価レーダーチャート</b>
      <svg viewBox="0 0 300 270"
        style="width:100%;max-width:340px;height:auto">
        ${grid}
        ${axes}
        <polygon points="${polygon(1)}"
          fill="#3b82f6" fill-opacity="0.25"
          stroke="#2563eb" stroke-width="2"/>
        ${dots}
        ${textLabels}
      </svg>
    </div>`;
}function popup(u) {
  return `
    <div class="popup-title">${u.name}</div>
    <div class="popup-sub">${u.region}・位置は概略</div>

    <div class="metric">
      <span>猛暑日・真夏日</span>
      <b>${u.heat}/20</b>
    </div>
    <div class="metric">
      <span>日較差</span>
      <b>${u.temperature}/20</b>
    </div>
    <div class="metric">
      <span>年間降水量</span>
      <b>${u.rain}/20</b>
    </div>
    <div class="metric">
      <span>洪水</span>
      <b>${u.flood}/20</b>
    </div>
    <div class="metric">
      <span>地震リスク</span>
      <b>${u.quake}/20</b>
    </div>
 <div class="metric">
      <span><strong>5項目の合計点</strong></span>
      <b>${(
        Number(u.heat) +
        Number(u.temperature) +
        Number(u.rain) +
        Number(u.flood) +
        Number(u.quake)
      ).toFixed(1)}/100点</b>
    </div>
    ${radarChart(u)}

    <p style="font-size:12px">${u.comment || ""}</p>
  `;
}
function getUniversityType(u) { 
  const name = u.name;

  const publicNames = [
    "国際教養大学",
    "金沢美術工芸大学",
    "石川県立大学",
    "石川県立看護大学",
    "公立小松大学",
    "大阪公立大学"
  ];

  const privateNames = [
    "早稲田大学",
    "慶應義塾大学",
    "明治大学",
    "青山学院大学",
    "立教大学",
    "中央大学",
    "法政大学",
    "立命館大学",
    "同志社大学",
    "関西大学",
    "関西学院大学"
  ];

  if (publicNames.some(n => name.startsWith(n))) return "公立";
  if (privateNames.some(n => name.startsWith(n))) return "私立";
  return "国立";
}  
  universities.forEach(u => {
  const type = getUniversityType(u);
  const color = type === "国立" ? "#2563eb"
              : type === "公立" ? "#16a34a"
              : "#e11d48";

  const m = L.circleMarker([u.lat, u.lon], {
    radius: 7,
    color: color,
    fillColor: color,
    fillOpacity: 0.9,
    weight: 1.5
  }).addTo(map).bindPopup(popup(u));

  m.uni = u;
  markers.push(m);
});
function render(q=""){list.innerHTML="";const matches=universities.filter(u=>(u.name+u.region).toLowerCase().includes(q.trim().toLowerCase()));
if(!matches.length){list.innerHTML='<p class="hint">該当する大学がありません。</p>';return}
  matches.forEach(u=>{const b=document.createElement('button');b.className='uni-button';b.innerHTML=`<strong>${u.name}</strong><span>${u.region}</span>`;b.onclick = () => {
  map.setView([u.lat, u.lon], 11);

  const m = markers.find(x => x.uni === u);
  if (m) m.openPopup();

  document.getElementById("map").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
};;list.appendChild(b)})}
search.addEventListener('input',()=>render(search.value));render();
</script>
