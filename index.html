const map=L.map('map').setView([37.2,137.8],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(map);
const markers=[],list=document.getElementById('university-list'),search=document.getElementById('search');
function popup(u){return `<div class="popup-title">${u.name}</div><div class="popup-sub">${u.region}・位置は概略</div>
<div class="metric"><span>猛暑日・真夏日</span><b>${u.heat}/20</b></div>
<div class="metric"><span>日較差</span><b>${u.temperature}/20</b></div>
<div class="metric"><span>年間降水量</span><b>${u.rain}/20</b></div>
<div class="metric"><span>洪水</span><b>${u.flood}/20</b></div>
<div class="metric"><span>地震リスク</span><b>${u.quake}/20</b></div><p style="font-size:12px">${u.comment}</p>`}
universities.forEach(u=>{const m=L.marker([u.lat,u.lon]).addTo(map).bindPopup(popup(u));m.uni=u;markers.push(m)});
function render(q=""){list.innerHTML="";const matches=universities.filter(u=>(u.name+u.region).toLowerCase().includes(q.trim().toLowerCase()));
if(!matches.length){list.innerHTML='<p class="hint">該当する大学がありません。</p>';return}
  matches.forEach(u=>{const b=document.createElement('button');b.className='uni-button';b.innerHTML=`<strong>${u.name}</strong><span>${u.region}</span>`;b.onclick=()=>{map.setView([u.lat,u.lon],11);const m=markers.find(x=>x.uni===u);if(m)m.openPopup()};list.appendChild(b)})}
search.addEventListener('input',()=>render(search.value));render();
